<!-- ========================================================================
     Gulf Football Federation (GFF) — Bilingual Email Signature
     Production file · fully inline CSS · table-based · ~600px wide
     COMBINED layout: name & title in TWO COLUMNS (Arabic right / English left),
     then ONE shared contact list with bilingual labels (Arabic first) — the
     phone/email/P.O. Box values are not duplicated.
     Logo path "gff-logo.png" resolves inside this /dist folder. For production
     email, host gff-logo.png and replace the src with its full https:// URL.
     ======================================================================== -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px;max-width:600px;border-collapse:collapse;background-color:#ffffff;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td style="padding:24px 28px 26px 28px;background-color:#ffffff;">

      <!-- ---------- Logo (full-color master lockup, left-aligned) ---------- -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
        <tr>
          <td style="padding:0;">
            <img src="gff-logo.png" alt="Gulf Football Federation — الاتحاد الخليجي لكرة القدم" width="280" height="107" style="display:block;width:280px;height:107px;border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;" />
          </td>
        </tr>
      </table>

      <!-- ---------- Brand divider (Stricker Teal) ---------- -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse;">
        <tr><td height="16" style="height:16px;line-height:16px;font-size:0;">&nbsp;</td></tr>
        <tr><td height="2" style="height:2px;line-height:2px;font-size:0;background-color:#49C5B1;">&nbsp;</td></tr>
        <tr><td height="16" style="height:16px;line-height:16px;font-size:0;">&nbsp;</td></tr>
      </table>

      <!-- ====== NAME & TITLE — two columns: English (left) | Arabic (right) ====== -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse;">
        <tr>
          <!-- English column (left) -->
          <td width="50%" valign="top" align="left" style="width:50%;vertical-align:top;text-align:left;">
            <div dir="ltr" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:22px;font-weight:bold;color:#043D56;">Abdullah Abbas</div>
            <div dir="ltr" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:18px;color:#34677E;padding-top:3px;">Graphic Designer</div>
          </td>
          <!-- Arabic column (right) -->
          <td width="50%" valign="top" align="right" style="width:50%;vertical-align:top;text-align:right;">
            <div dir="rtl" style="font-family:Tahoma,Arial,sans-serif;font-size:20px;line-height:26px;font-weight:bold;color:#00558C;">عبدالله عباس</div>
            <div dir="rtl" style="font-family:Tahoma,Arial,sans-serif;font-size:14px;line-height:19px;color:#00558C;padding-top:3px;">مصمم جرافيك</div>
          </td>
        </tr>
      </table>

      <!-- ---------- Divider ---------- -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse;">
        <tr><td height="16" style="height:16px;line-height:16px;font-size:0;">&nbsp;</td></tr>
        <tr><td height="1" style="height:1px;line-height:1px;font-size:0;background-color:#49C5B1;">&nbsp;</td></tr>
        <tr><td height="16" style="height:16px;line-height:16px;font-size:0;">&nbsp;</td></tr>
      </table>

      <!-- ====== SHARED CONTACT DETAILS (bilingual labels, Arabic first) ====== -->
      <table role="presentation" dir="ltr" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse;">
        <tr>
          <td align="left" style="text-align:left;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:23px;color:#043D56;">
            <span dir="rtl" style="font-family:Tahoma,Arial,sans-serif;color:#34677E;">الجوال</span> <span style="color:#34677E;">| Mobile:</span> <span style="color:#043D56;">+974&nbsp;XXXXXXXX</span><br />
            <span dir="rtl" style="font-family:Tahoma,Arial,sans-serif;color:#34677E;">الهاتف</span> <span style="color:#34677E;">| Tel:</span> <span style="color:#043D56;">+974&nbsp;XXXXXXXX</span><br />
            <span dir="rtl" style="font-family:Tahoma,Arial,sans-serif;color:#34677E;">البريد</span> <span style="color:#34677E;">| Email:</span> <a href="mailto:example@gff.org.qa" style="color:#00558C;text-decoration:none;">example@gff.org.qa</a><br />
            <span dir="rtl" style="font-family:Tahoma,Arial,sans-serif;color:#34677E;">ص.ب</span> <span style="color:#34677E;">| P.O. Box:</span> <span style="color:#043D56;">XXXX - Doha, Qatar</span>
          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>
