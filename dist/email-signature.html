<!-- ========================================================================
     Gulf Football Federation (GFF) — Bilingual Email Signature
     Production file · fully inline CSS · table-based · ~600px wide
     LAYOUT (mirrors the Qatar government / CGB house style):
       - Centered text block on the LEFT: stacked Arabic-over-English pairs
         (name, then title), followed by the contact values (two phone numbers
         on one line, then email). No field labels.
       - A vertical teal divider, then the GFF logo on the RIGHT.
     Logo path "gff-logo.png" resolves inside this /dist folder. For production
     email, host gff-logo.png and replace the src with its full https:// URL.
     ======================================================================== -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px;max-width:600px;border-collapse:collapse;background-color:#ffffff;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td style="padding:22px 28px;background-color:#ffffff;">

      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse;">
        <tr>

          <!-- ================= TEXT BLOCK (left, centered) ================= -->
          <td valign="middle" align="center" style="vertical-align:middle;text-align:center;">

            <!-- Name: Arabic over English (brand blue) -->
            <div dir="rtl" style="font-family:Tahoma,Arial,sans-serif;font-size:20px;line-height:26px;font-weight:bold;color:#00558C;">عبدالله عباس</div>
            <div dir="ltr" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:21px;font-weight:bold;color:#00558C;letter-spacing:.4px;">ABDULLAH ABBAS</div>

            <!-- Title: Arabic over English -->
            <div dir="rtl" style="font-family:Tahoma,Arial,sans-serif;font-size:14px;line-height:20px;color:#043D56;padding-top:6px;">مصمم جرافيك</div>
            <div dir="ltr" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:18px;color:#34677E;">Graphic Designer</div>

            <!-- Contact values: two phones on one line, then email -->
            <div dir="ltr" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#043D56;padding-top:10px;">+974&nbsp;XXXXXXXX&nbsp;/&nbsp;+974&nbsp;XXXXXXXX</div>
            <div dir="ltr" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;"><a href="mailto:example@gff.org.qa" style="color:#00558C;text-decoration:none;">example@gff.org.qa</a></div>

          </td>

          <!-- spacer -->
          <td width="18" style="width:18px;font-size:0;line-height:0;">&nbsp;</td>
          <!-- ================= vertical brand divider ================= -->
          <td width="2" style="width:2px;font-size:0;line-height:0;background-color:#49C5B1;">&nbsp;</td>
          <!-- spacer -->
          <td width="18" style="width:18px;font-size:0;line-height:0;">&nbsp;</td>

          <!-- ===================== LOGO (right) ===================== -->
          <td valign="middle" align="right" width="190" style="vertical-align:middle;text-align:right;width:190px;">
            <img src="gff-logo.png" alt="Gulf Football Federation — الاتحاد الخليجي لكرة القدم" width="190" height="73" style="display:block;width:190px;height:73px;border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;" />
          </td>

        </tr>
      </table>

    </td>
  </tr>
</table>
