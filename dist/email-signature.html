<!-- ========================================================================
     Gulf Football Federation (GFF) — Bilingual Email Signature
     Production file · fully inline CSS · table-based · ~600px wide
     Arabic (RTL) first, English (LTR) second.
     Logo path "gff-logo.png" resolves inside this /dist folder.
     For production email, host gff-logo.png and replace the src with its
     full https:// URL (see README "Export notes").
     ======================================================================== -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px;max-width:600px;border-collapse:collapse;background-color:#ffffff;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td style="padding:24px 28px 26px 28px;background-color:#ffffff;">

      <!-- ---------- Logo (full-color master lockup, left-aligned) ---------- -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
        <tr>
          <td style="padding:0;">
            <img src="gff-logo.png" alt="Gulf Football Federation — الاتحاد الخليجي لكرة القدم" width="280" height="107" style="display:block;width:280px;height:107px;border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;" />
          </td>
        </tr>
      </table>

      <!-- ---------- Brand divider (Stricker Teal) ---------- -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse;">
        <tr><td height="16" style="height:16px;line-height:16px;font-size:0;">&nbsp;</td></tr>
        <tr><td height="2" style="height:2px;line-height:2px;font-size:0;background-color:#49C5B1;">&nbsp;</td></tr>
        <tr><td height="18" style="height:18px;line-height:18px;font-size:0;">&nbsp;</td></tr>
      </table>

      <!-- ============================ ARABIC (RTL) ============================ -->
      <table role="presentation" dir="rtl" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse;direction:rtl;">
        <tr>
          <td align="right" style="text-align:right;font-family:Tahoma,Arial,sans-serif;">
            <div style="font-family:Tahoma,Arial,sans-serif;font-size:20px;line-height:26px;font-weight:bold;color:#00558C;">عبدالله عباس</div>
            <div style="font-family:Tahoma,Arial,sans-serif;font-size:14px;line-height:20px;color:#00558C;padding-top:2px;">مصمم جرافيك</div>
          </td>
        </tr>
        <tr><td height="10" style="height:10px;line-height:10px;font-size:0;">&nbsp;</td></tr>
        <tr>
          <td align="right" style="text-align:right;font-family:Tahoma,Arial,sans-serif;font-size:13px;line-height:22px;color:#043D56;">
            <span style="color:#34677E;">الجوال:</span> <span dir="ltr" style="unicode-bidi:embed;color:#043D56;">+974&nbsp;XXXXXXXX</span><br />
            <span style="color:#34677E;">الهاتف:</span> <span dir="ltr" style="unicode-bidi:embed;color:#043D56;">+974&nbsp;XXXXXXXX</span><br />
            <span style="color:#34677E;">البريد الإلكتروني:</span> <a href="mailto:example@gff.org.qa" dir="ltr" style="unicode-bidi:embed;color:#00558C;text-decoration:none;">example@gff.org.qa</a><br />
            <span style="color:#34677E;">ص.ب:</span> <span style="color:#043D56;">XXXX - الدوحة، قطر</span>
          </td>
        </tr>
      </table>

      <!-- ---------- Divider between Arabic and English ---------- -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse;">
        <tr><td height="18" style="height:18px;line-height:18px;font-size:0;">&nbsp;</td></tr>
        <tr><td height="1" style="height:1px;line-height:1px;font-size:0;background-color:#49C5B1;">&nbsp;</td></tr>
        <tr><td height="18" style="height:18px;line-height:18px;font-size:0;">&nbsp;</td></tr>
      </table>

      <!-- ============================ ENGLISH (LTR) ============================ -->
      <table role="presentation" dir="ltr" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse;direction:ltr;">
        <tr>
          <td align="left" style="text-align:left;font-family:Arial,Helvetica,sans-serif;">
            <div style="font-family:Arial,Helvetica,sans-serif;font-size:20px;line-height:26px;font-weight:bold;color:#00558C;">Abdullah Abbas</div>
            <div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:20px;color:#00558C;padding-top:2px;">Graphic Designer</div>
          </td>
        </tr>
        <tr><td height="10" style="height:10px;line-height:10px;font-size:0;">&nbsp;</td></tr>
        <tr>
          <td align="left" style="text-align:left;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:22px;color:#043D56;">
            <span style="color:#34677E;">Mobile:</span> <span style="color:#043D56;">+974&nbsp;XXXXXXXX</span><br />
            <span style="color:#34677E;">Tel:</span> <span style="color:#043D56;">+974&nbsp;XXXXXXXX</span><br />
            <span style="color:#34677E;">Email:</span> <a href="mailto:example@gff.org.qa" style="color:#00558C;text-decoration:none;">example@gff.org.qa</a><br />
            <span style="color:#34677E;">P.O. Box:</span> <span style="color:#043D56;">XXXX - Doha, Qatar</span>
          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>
